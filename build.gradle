plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Dev builds always use the newest RuneLite client: 'latest.release', the same
// form RuneLite's own example-plugin template uses. The Plugin Hub replaces this
// file at submission (build=standard) and builds against its own client, so this
// only decides what ./gradlew build / test / run use here. Following the newest
// client matters for the dev client too: it loads the Plugin Hub index for its
// own version, so on an old pin other Hub plugins stay on old builds.
//
// Trade-off: a RuneLite release can break this build on a day nothing in this
// repo changed. To tell the two apart, pin one run to a known-good client:
//   ./gradlew build -PruneLiteVersion=1.13.6
// Releases are listed at:
//   https://repo.runelite.net/net/runelite/client/maven-metadata.xml
def runeLiteVersion = project.findProperty('runeLiteVersion') ?: 'latest.release'
def pluginMainClass = 'com.vinnyvangogh.groupironman.GroupIronmanPluginTest'

// Re-check repo.runelite.net for a newer release on every build instead of
// Gradle's default 24-hour cache of dynamic versions. Gradle has no per-module
// setting for this, but the RuneLite artifacts are the only dynamic versions in
// this file, so nothing else is affected. --offline still builds from the cache.
configurations.configureEach {
	resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

// Do NOT add gson, guice, okhttp or anything else that arrives transitively
// from runelite-client. Inject them instead. Declaring them here is a
// Plugin Hub rejection.

group = 'com.vinnyvangogh.groupironman'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Prints which RuneLite client this build resolved, so a failing test or a
// client that will not start says which release it was. Runs before test and
// run, and on its own: ./gradlew printRuneLiteVersion
tasks.register('printRuneLiteVersion') {
	group = 'help'
	description = 'Prints the RuneLite client version this build resolved.'
	def requested = runeLiteVersion
	def classpath = configurations.testRuntimeClasspath
	doLast {
		def client = classpath.incoming.resolutionResult.allComponents
			.collect { it.moduleVersion }
			.find { it != null && it.group == 'net.runelite' && it.name == 'client' }
		logger.lifecycle("RuneLite client ${client?.version ?: 'not resolved'} (requested ${requested})")
	}
}

tasks.named('test') {
	dependsOn 'printRuneLiteVersion'
}

tasks.register('run', JavaExec) {
	dependsOn 'printRuneLiteVersion'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"

	// RuneLite's OSXFullScreenAdapter extends com.apple.eawt.FullScreenAdapter.
	// java.desktop stopped exporting com.apple.eawt to the unnamed module after
	// Java 8, so on macOS the developer client dies at startup with
	// IllegalAccessError unless the export is reopened. Dev-only: the Plugin Hub
	// packager replaces this file at submission because build=standard.
	//
	// Do not "clean this up". Removing it breaks ./gradlew run on macOS only,
	// which is the one machine you will notice it on.
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		jvmArgs "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	}

	// RuneLite derives RUNELITE_DIR from user.home, so overriding it gives a
	// second client its own .runelite: separate credentials, config and output.
	// Needed whenever a measurement requires two accounts logged in at once.
	//   ./gradlew run -PaltHome=/path/to/alt-home
	if (project.hasProperty('altHome')) {
		jvmArgs "-Duser.home=${project.altHome}"
	}

	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
