plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Pinned, not 'latest.release' as the upstream example-plugin ships it. The
// Plugin Hub manifest points at one commit of this repo, so the build that
// commit produces has to be reproducible; a floating dependency means a build
// that passed yesterday can fail today for reasons nothing in this repo
// changed. Bump deliberately, checking:
//   https://repo.runelite.net/net/runelite/client/maven-metadata.xml
// To test against another client without changing the pin (e.g. the Plugin
// Hub's current one): ./gradlew test -PruneLiteVersion=1.13.6
def runeLiteVersion = project.findProperty('runeLiteVersion') ?: '1.13.5'
def pluginMainClass = 'com.vinnyvangogh.groupironman.GroupIronmanPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	// UI tests only (src/test/java/com/vinnyvangogh/testkit/ui): stands in for the client's
	// ItemManager, SpriteManager and ConfigManager, which need a running game. Test scope
	// never reaches the Hub jar: the Hub replaces this file and builds main only.
	testImplementation 'org.mockito:mockito-core:5.14.2'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

// UI tests drive the plugin's own Swing panels without a window, so they run
// headless by default: on CI, and on the Mac without taking focus. The two
// clipboard tests need a display and skip without one; run them with
//   ./gradlew test -Pheadful
tasks.named('test', Test) {
	systemProperty 'java.awt.headless', project.hasProperty('headful') ? 'false' : 'true'
}

// Renders the README's screenshots (ReadmeShots) into docs/images at fixed
// sizes, from made-up scenes. ./gradlew test renders the same shots into
// build/screenshots, so a broken shot fails the build first.
tasks.register('screenshots', Test) {
	description = 'Renders the README screenshots into docs/images'
	group = 'documentation'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching 'com.vinnyvangogh.groupironman.ReadmeShots'
	}
	systemProperty 'java.awt.headless', 'true'
	systemProperty 'screenshots.dir', file('docs/images').absolutePath
	outputs.upToDateWhen { false }
}

// Do NOT add gson, guice, okhttp or anything else that arrives transitively
// from runelite-client. Inject them instead. Declaring them here is a
// Plugin Hub rejection.

group = 'com.vinnyvangogh.groupironman'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"

	// RuneLite's OSXFullScreenAdapter extends com.apple.eawt.FullScreenAdapter.
	// java.desktop stopped exporting com.apple.eawt to the unnamed module after
	// Java 8, so on macOS the developer client dies at startup with
	// IllegalAccessError unless the export is reopened. Dev-only: the Plugin Hub
	// packager replaces this file at submission because build=standard.
	//
	// Do not "clean this up". Removing it breaks ./gradlew run on macOS only,
	// which is the one machine you will notice it on.
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		jvmArgs "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	}

	// RuneLite derives RUNELITE_DIR from user.home, so overriding it gives a
	// second client its own .runelite: separate credentials, config and output.
	// Needed whenever a measurement requires two accounts logged in at once.
	//   ./gradlew run -PaltHome=/path/to/alt-home
	if (project.hasProperty('altHome')) {
		jvmArgs "-Duser.home=${project.altHome}"
	}

	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
