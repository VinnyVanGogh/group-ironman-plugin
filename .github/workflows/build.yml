name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 11 is what the Plugin Hub builds with. Building on a newer JDK
      # locally can compile source the Hub's toolchain then rejects, so CI
      # pins the version the Hub actually uses.
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x ./gradlew
      - run: |
          set -o pipefail
          ./gradlew build --no-daemon --console=plain 2>&1 | tee gradle.log

      - if: failure()
        run: |
          grep -E 'error:|FAILED|symbol:|location:|AssertionError|ComparisonFailure|Exception' gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      # The Plugin Hub builds against its current client, which can be ahead
      # of the pin in build.gradle.
      - run: ./gradlew test --no-daemon -PruneLiteVersion=1.13.6
